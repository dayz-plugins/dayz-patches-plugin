[workspace]
resolver = "2"
members = ["crates/dayz-patches-plugin"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Unlicense"
repository = "https://github.com/dayz-plugins/dayz-patches-plugin"

[workspace.dependencies]
# uniloader and the DayZ adapter are sibling checkouts, not published crates: this repository
# is built against the loader and adapter it will run with (see scripts/gate.sh).
uniloader-sdk = { path = "../../uniloader/crates/uniloader-sdk" }
dayz-game = { path = "../dayz-adapter/crates/dayz-game" }
log = "0.4"
microseh = "1.2"

[workspace.lints.rust]
# "deny" rather than "forbid": patching the game is unsafe by nature, so the hook module
# allows it with a reason. Everything else in the plugin stays safe.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "warn"
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = 2
debug = 1
lto = "thin"
codegen-units = 1
# Never "abort": a plugin panic must unwind so the loader can catch it at the boundary.
panic = "unwind"
